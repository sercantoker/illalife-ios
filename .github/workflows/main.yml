name: IllaLife iOS IPA ve Simulator Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Proje Dosyalarini Cek
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Klasor Yapisini Hazirla ve iOS Ekle
        run: |
          if [ -d "github_ios_repo" ]; then
            cp -r github_ios_repo/* .
          fi
          npm install -g cordova
          cordova platform add ios
          cordova prepare ios

      - name: Xcode ile Gercek iPhone (.ipa) ve Online Simulator Paketi Derle
        run: |
          cd platforms/ios
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -project "$PROJECT" -list | awk '/Schemes:/{flag=1; next} flag && NF {sub(/^[ \t]+/, ""); print; exit}')
          
          # 1. Gercek iPhone icin derle (iphoneos)
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath build_device CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          # 2. Online Test (Appetize.io) icin Simulator derle (iphonesimulator)
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -arch x86_64 -derivedDataPath build_sim CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Paketleri Hazirla
        run: |
          mkdir -p Payload
          APP_DEVICE=$(find platforms/ios/build_device -name "*.app" -type d | head -n 1)
          cp -r "$APP_DEVICE" Payload/
          zip -r -q illalife.ipa Payload
          
          APP_SIM=$(find platforms/ios/build_sim -name "*.app" -type d | head -n 1)
          cd "$(dirname "$APP_SIM")"
          zip -r -q "$GITHUB_WORKSPACE/illalife-online-simulator.zip" "$(basename "$APP_SIM")"

      - name: Dosyalari Indirmeye Hazirla
        uses: actions/upload-artifact@v4
        with:
          name: illalife-ios-paketleri
          path: |
            illalife.ipa
            illalife-online-simulator.zip
