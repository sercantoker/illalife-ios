name: IllaLife iOS IPA ve Simulator Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Proje Dosyalarini Cek
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Klasor Yapisini Hazirla ve iOS Ekle
        run: |
          if [ -d "github_ios_repo" ]; then
            cp -r github_ios_repo/* .
          fi
          npm install -g cordova
          cordova platform add ios
          cordova prepare ios

      - name: 1. Gercek iPhone (.ipa) Derle ve Paketle
        run: |
          cd platforms/ios
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -project "$PROJECT" -list | awk '/Schemes:/{flag=1; next} flag && NF {sub(/^[ \t]+/, ""); print; exit}')
          
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/out_device" \
            SYMROOT="$GITHUB_WORKSPACE/out_device_sym" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          APP_DEVICE=$(find "$GITHUB_WORKSPACE/out_device" "$GITHUB_WORKSPACE/out_device_sym" "$GITHUB_WORKSPACE/platforms/ios" -name "*.app" -type d 2>/dev/null | head -n 1)
          echo "Bulunan Cihaz Paketi: $APP_DEVICE"
          
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R "$APP_DEVICE" "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE"
          zip -r -q illalife.ipa Payload
          rm -rf Payload out_device out_device_sym platforms/ios/build

      - name: 2. Online Simulator (.zip) Derle ve Paketle
        run: |
          cd platforms/ios
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -project "$PROJECT" -list | awk '/Schemes:/{flag=1; next} flag && NF {sub(/^[ \t]+/, ""); print; exit}')
          
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/out_sim" \
            SYMROOT="$GITHUB_WORKSPACE/out_sim_sym" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_SIM=$(find "$GITHUB_WORKSPACE/out_sim" "$GITHUB_WORKSPACE/out_sim_sym" "$GITHUB_WORKSPACE/platforms/ios" -name "*.app" -type d 2>/dev/null | head -n 1)
          echo "Bulunan Simulator Paketi: $APP_SIM"
          
          SIM_DIR=$(dirname "$APP_SIM")
          SIM_NAME=$(basename "$APP_SIM")
          cd "$SIM_DIR"
          zip -r -q "$GITHUB_WORKSPACE/illalife-online-simulator.zip" "$SIM_NAME"

      - name: Dosyalari Indirmeye Hazirla
        uses: actions/upload-artifact@v4
        with:
          name: illalife-ios-paketleri
          path: |
            illalife.ipa
            illalife-online-simulator.zip
