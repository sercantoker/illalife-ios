<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: gap: content: blob:; frame-src *;">
    <title>illalife</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background-color: #000000; }
        iframe { position: fixed; top: 0; left: 0; bottom: 0; right: 0; width: 100%; height: 100%; height: 100dvh; border: none; display: block; z-index: 1; background-color: #ffffff; }
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: #000000 url('splash.png') no-repeat center center; background-size: contain; z-index: 9999; transition: opacity 0.6s ease; }
    </style>
</head>
<body>
    <div id="splash"></div>
    <iframe src="https://www.illa.com.tr/index.php" allow="fullscreen; geolocation; microphone; camera" allowfullscreen></iframe>
    <script>
        setTimeout(function() {
            var s = document.getElementById('splash');
            if (s) { s.style.opacity = '0'; setTimeout(function() { s.style.display = 'none'; }, 600); }
        }, 3500);
    </script>
</body>
</html>
